<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SelfPublisherForge</title>
  <link rel="stylesheet" href="../styles/popup.css" />
  <style>
    /* Status message styles */
    .status-message {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.4;
    }
    .status-message--error {
      color: #d32f2f;
      background-color: #fdecea;
      border: 1px solid #f5c6cb;
    }
    .status-message--success {
      color: #2e7d32;
      background-color: #edf7ed;
      border: 1px solid #c3e6cb;
    }

    /* Loading spinner */
    .loading-spinner {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ccc;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="spf-header">
      <h1 class="spf-logo">SPF</h1>
      <span id="auth-status" class="auth-badge auth-badge--disconnected">
        Disconnected
      </span>
    </header>

    <!-- Login section (visible when not authenticated) -->
    <section id="login-section" class="section">
      <p class="section__description">
        Connect to your SelfPublisherForge account to save research data.
      </p>
      <div class="form-group">
        <label for="api-url">API URL</label>
        <input
          id="api-url"
          type="url"
          placeholder="https://api.selfpublisherforge.com"
          value=""
        />
      </div>
      <div class="form-group">
        <label for="api-token">API Token</label>
        <input id="api-token" type="password" placeholder="Paste your API token" />
      </div>
      <button id="btn-connect" class="btn btn--primary btn--full">
        Connect
      </button>

      <!-- Status message area for connection feedback -->
      <div id="status-message" class="status-message hidden"></div>

      <!-- Loading spinner (hidden by default) -->
      <div id="loading-spinner" class="loading-spinner hidden">
        <div class="spinner"></div>
        <span>Testing connection...</span>
      </div>
    </section>

    <!-- Quick actions (visible when authenticated) -->
    <section id="actions-section" class="section hidden">
      <h2 class="section__title">Quick Actions</h2>

      <button id="btn-extract" class="btn btn--primary btn--full">
        Extract Page Data
      </button>

      <button id="btn-sidebar" class="btn btn--secondary btn--full">
        Open Research Sidebar
      </button>

      <button id="btn-clip" class="btn btn--secondary btn--full">
        Clip Selection to Vault
      </button>

      <div id="extract-result" class="result-box hidden"></div>

      <hr class="divider" />

      <button id="btn-disconnect" class="btn btn--danger btn--full btn--small">
        Disconnect
      </button>
    </section>

    <!-- Footer -->
    <footer class="spf-footer">
      <small id="version-label">SelfPublisherForge v1.0.0</small>
      <a id="update-badge" class="update-badge hidden" href="#" title="Click to update">
        Update available!
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
