[alembic]
script_location = migrations
# sqlalchemy.url is intentionally left empty here; env.py reads DATABASE_URL
# from the environment at runtime. For local development without DATABASE_URL,
# it falls back to postgresql+asyncpg://postgres:postgres@localhost:5432/selfpublisherforge
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
