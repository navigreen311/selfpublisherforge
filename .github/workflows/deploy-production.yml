# =============================================================================
# Deploy to Production — On tag push, release publish, or manual dispatch
# =============================================================================
name: Deploy to Production

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: selfpublisherforge-production
  ENVIRONMENT: production

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Validate Required Secrets
  # ---------------------------------------------------------------------------
  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are set
        run: |
          MISSING=""

          if [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            MISSING="$MISSING\n  - AWS_ACCOUNT_ID"
          fi
          if [ -z "${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}" ]; then
            MISSING="$MISSING\n  - AWS_PROD_DEPLOY_ROLE_ARN"
          fi
          if [ -z "${{ secrets.PRODUCTION_API_URL }}" ]; then
            MISSING="$MISSING\n  - PRODUCTION_API_URL"
          fi
          if [ -z "${{ secrets.PROD_TARGET_GROUP_ARN }}" ]; then
            MISSING="$MISSING\n  - PROD_TARGET_GROUP_ARN"
          fi
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            MISSING="$MISSING\n  - SLACK_WEBHOOK_URL"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::The following required secrets are missing:$MISSING"
            echo "Please configure these secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "All required secrets are configured."

  # ---------------------------------------------------------------------------
  # Build and Push Docker Images to ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: validate-secrets
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/selfpublisherforge-api:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/selfpublisherforge-api:production-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/selfpublisherforge-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/selfpublisherforge-frontend:production-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/selfpublisherforge-api:${{ steps.meta.outputs.tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Scan Frontend container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/selfpublisherforge-frontend:${{ steps.meta.outputs.tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Push API image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/selfpublisherforge-api:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/selfpublisherforge-api:production-latest

      - name: Push Frontend image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/selfpublisherforge-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/selfpublisherforge-frontend:production-latest

  # ---------------------------------------------------------------------------
  # Blue-Green Deploy to Production ECS
  # ---------------------------------------------------------------------------
  deploy:
    name: Blue-Green Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      previous-api-task-def: ${{ steps.save-current.outputs.api-task-def }}
      previous-frontend-task-def: ${{ steps.save-current.outputs.frontend-task-def }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Save current task definitions for rollback
        id: save-current
        run: |
          aws ecs describe-task-definition \
            --task-definition selfpublisherforge-api-production \
            --query taskDefinition > current-api-task-def.json
          echo "api-task-def=$(cat current-api-task-def.json | jq -r '.taskDefinitionArn')" >> "$GITHUB_OUTPUT"

          aws ecs describe-task-definition \
            --task-definition selfpublisherforge-frontend-production \
            --query taskDefinition > current-frontend-task-def.json
          echo "frontend-task-def=$(cat current-frontend-task-def.json | jq -r '.taskDefinitionArn')" >> "$GITHUB_OUTPUT"

      - name: Download API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition selfpublisherforge-api-production \
            --query taskDefinition > api-task-def.json

      - name: Update API task definition with new image
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-def.json
          container-name: api
          image: ${{ env.ECR_REGISTRY }}/selfpublisherforge-api:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy API to Production ECS (blue-green)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: selfpublisherforge-api-production
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          codedeploy-appspec: infra/appspec.yml
          codedeploy-application: selfpublisherforge-production
          codedeploy-deployment-group: selfpublisherforge-api-production-dg

      - name: Download Frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition selfpublisherforge-frontend-production \
            --query taskDefinition > frontend-task-def.json

      - name: Update Frontend task definition with new image
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ env.ECR_REGISTRY }}/selfpublisherforge-frontend:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy Frontend to Production ECS (blue-green)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: selfpublisherforge-frontend-production
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Deploy Worker and Beat to Production
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service selfpublisherforge-worker-production \
            --force-new-deployment
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service selfpublisherforge-beat-production \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services selfpublisherforge-worker-production selfpublisherforge-beat-production

  # ---------------------------------------------------------------------------
  # Health Checks & Auto-Rollback
  # ---------------------------------------------------------------------------
  health-check:
    name: Health Check & Auto-Rollback
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for deployment stabilization
        run: sleep 60

      - name: Smoke test — health endpoint with retries
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_API_URL }}/health"
          MAX_RETRIES=7
          RETRY_DELAY=15
          ATTEMPT=0

          echo "Running smoke test against $HEALTH_URL"
          echo "Configuration: max_retries=$MAX_RETRIES, retry_delay=${RETRY_DELAY}s, total_window=~$((MAX_RETRIES * RETRY_DELAY))s"

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_RETRIES..."

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP $HTTP_STATUS)"
              break
            fi

            echo "Health check returned HTTP $HTTP_STATUS"

            if [ $ATTEMPT -eq $MAX_RETRIES ]; then
              echo "::error::[SMOKE TEST] Basic health endpoint failed after $MAX_RETRIES attempts. Last HTTP status: $HTTP_STATUS. The API service may not be running."
              exit 1
            fi

            echo "Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

      - name: Check API health endpoint
        id: api-health
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_API_URL }}/health"
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "$HEALTH_URL" || echo -e "\n000")
          BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          echo "API health response body: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::[API HEALTH] API health endpoint returned HTTP $HTTP_STATUS. Expected 200. The API process may have crashed or is unresponsive."
            exit 1
          fi

          echo "API health check passed (HTTP $HTTP_STATUS)"

      - name: Check database connectivity
        id: db-health
        run: |
          # Check detailed health endpoint that verifies database connectivity
          DB_HEALTH_URL="${{ secrets.PRODUCTION_API_URL }}/health?detail=true"
          MAX_RETRIES=3
          RETRY_DELAY=10
          ATTEMPT=0

          echo "Checking database connectivity via $DB_HEALTH_URL"

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "DB health check attempt $ATTEMPT of $MAX_RETRIES..."

            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "$DB_HEALTH_URL" || echo -e "\n000")
            BODY=$(echo "$RESPONSE" | head -n -1)
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

            echo "Response body: $BODY"
            echo "HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "000" ]; then
              echo "::warning::[DATABASE] Connection timeout on attempt $ATTEMPT"
            elif [ "$HTTP_STATUS" = "200" ]; then
              # Verify response body contains database status indicator
              if echo "$BODY" | jq -e '.database // .db // .components.database // empty' > /dev/null 2>&1; then
                DB_STATUS=$(echo "$BODY" | jq -r '.database.status // .db.status // .components.database.status // "unknown"')
                if [ "$DB_STATUS" = "healthy" ] || [ "$DB_STATUS" = "ok" ] || [ "$DB_STATUS" = "up" ] || [ "$DB_STATUS" = "connected" ]; then
                  echo "db_status=healthy" >> "$GITHUB_OUTPUT"
                  echo "Database connectivity verified (status: $DB_STATUS)"
                  exit 0
                else
                  echo "::warning::[DATABASE] Database status is '$DB_STATUS' (not healthy)"
                fi
              else
                # Fallback: if no structured DB info, verify API can serve data-dependent request
                echo "No structured database field in health response. Falling back to data endpoint check..."
                DATA_URL="${{ secrets.PRODUCTION_API_URL }}/api/v1/health/db"
                DATA_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "$DATA_URL" || echo -e "\n000")
                DATA_BODY=$(echo "$DATA_RESPONSE" | head -n -1)
                DATA_STATUS=$(echo "$DATA_RESPONSE" | tail -n 1)

                if [ "$DATA_STATUS" = "200" ]; then
                  echo "db_status=healthy" >> "$GITHUB_OUTPUT"
                  echo "Database connectivity verified via /api/v1/health/db (HTTP $DATA_STATUS)"
                  exit 0
                elif [ "$DATA_STATUS" = "404" ]; then
                  # Endpoint does not exist; accept the basic 200 from /health?detail=true
                  echo "db_status=inferred" >> "$GITHUB_OUTPUT"
                  echo "::warning::[DATABASE] No dedicated DB health endpoint found. Accepting basic health check as proxy."
                  exit 0
                else
                  echo "::warning::[DATABASE] Data endpoint returned HTTP $DATA_STATUS"
                fi
              fi
            else
              echo "::warning::[DATABASE] Health detail endpoint returned HTTP $HTTP_STATUS"
            fi

            if [ $ATTEMPT -eq $MAX_RETRIES ]; then
              echo "db_status=failed" >> "$GITHUB_OUTPUT"
              echo "::error::[DATABASE] Database connectivity check failed after $MAX_RETRIES attempts. Last HTTP status: $HTTP_STATUS. The database may be unreachable, misconfigured, or migrations may not have run."
              exit 1
            fi

            echo "Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

      - name: Check Redis connectivity
        id: redis-health
        run: |
          # Check Redis connectivity via dedicated or detailed health endpoint
          REDIS_HEALTH_URL="${{ secrets.PRODUCTION_API_URL }}/health?detail=true"
          MAX_RETRIES=3
          RETRY_DELAY=10
          ATTEMPT=0

          echo "Checking Redis connectivity via $REDIS_HEALTH_URL"

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Redis health check attempt $ATTEMPT of $MAX_RETRIES..."

            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "$REDIS_HEALTH_URL" || echo -e "\n000")
            BODY=$(echo "$RESPONSE" | head -n -1)
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

            echo "Response body: $BODY"
            echo "HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "000" ]; then
              echo "::warning::[REDIS] Connection timeout on attempt $ATTEMPT"
            elif [ "$HTTP_STATUS" = "200" ]; then
              # Verify response body contains Redis status indicator
              if echo "$BODY" | jq -e '.redis // .cache // .components.redis // empty' > /dev/null 2>&1; then
                REDIS_STATUS=$(echo "$BODY" | jq -r '.redis.status // .cache.status // .components.redis.status // "unknown"')
                if [ "$REDIS_STATUS" = "healthy" ] || [ "$REDIS_STATUS" = "ok" ] || [ "$REDIS_STATUS" = "up" ] || [ "$REDIS_STATUS" = "connected" ]; then
                  echo "redis_status=healthy" >> "$GITHUB_OUTPUT"
                  echo "Redis connectivity verified (status: $REDIS_STATUS)"
                  exit 0
                else
                  echo "::warning::[REDIS] Redis status is '$REDIS_STATUS' (not healthy)"
                fi
              else
                # Fallback: try dedicated Redis health endpoint
                echo "No structured Redis field in health response. Falling back to dedicated endpoint..."
                REDIS_URL="${{ secrets.PRODUCTION_API_URL }}/api/v1/health/redis"
                REDIS_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "$REDIS_URL" || echo -e "\n000")
                REDIS_BODY=$(echo "$REDIS_RESPONSE" | head -n -1)
                REDIS_HTTP_STATUS=$(echo "$REDIS_RESPONSE" | tail -n 1)

                if [ "$REDIS_HTTP_STATUS" = "200" ]; then
                  echo "redis_status=healthy" >> "$GITHUB_OUTPUT"
                  echo "Redis connectivity verified via /api/v1/health/redis (HTTP $REDIS_HTTP_STATUS)"
                  exit 0
                elif [ "$REDIS_HTTP_STATUS" = "404" ]; then
                  # Endpoint does not exist; accept basic health as proxy
                  echo "redis_status=inferred" >> "$GITHUB_OUTPUT"
                  echo "::warning::[REDIS] No dedicated Redis health endpoint found. Accepting basic health check as proxy."
                  exit 0
                else
                  echo "::warning::[REDIS] Dedicated Redis endpoint returned HTTP $REDIS_HTTP_STATUS"
                fi
              fi
            else
              echo "::warning::[REDIS] Health detail endpoint returned HTTP $HTTP_STATUS"
            fi

            if [ $ATTEMPT -eq $MAX_RETRIES ]; then
              echo "redis_status=failed" >> "$GITHUB_OUTPUT"
              echo "::error::[REDIS] Redis connectivity check failed after $MAX_RETRIES attempts. Last HTTP status: $HTTP_STATUS. Redis may be unreachable or the Celery broker connection may be down."
              exit 1
            fi

            echo "Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

      - name: Check error rate from CloudWatch (7-minute window)
        id: error-rate
        run: |
          LOOKBACK_MINUTES=7
          PERIOD_SECONDS=$((LOOKBACK_MINUTES * 60))

          echo "Checking error rate over the last ${LOOKBACK_MINUTES} minutes..."

          ERROR_RATE=$(aws cloudwatch get-metric-statistics \
            --namespace "AWS/ApplicationELB" \
            --metric-name "HTTPCode_Target_5XX_Count" \
            --dimensions Name=TargetGroup,Value="${{ secrets.PROD_TARGET_GROUP_ARN }}" \
            --start-time "$(date -u -d "${LOOKBACK_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%S)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --period $PERIOD_SECONDS \
            --statistics Sum \
            --query 'Datapoints[0].Sum // `0`' \
            --output text)

          TOTAL_REQUESTS=$(aws cloudwatch get-metric-statistics \
            --namespace "AWS/ApplicationELB" \
            --metric-name "RequestCount" \
            --dimensions Name=TargetGroup,Value="${{ secrets.PROD_TARGET_GROUP_ARN }}" \
            --start-time "$(date -u -d "${LOOKBACK_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%S)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --period $PERIOD_SECONDS \
            --statistics Sum \
            --query 'Datapoints[0].Sum // `1`' \
            --output text)

          if [ "$TOTAL_REQUESTS" -gt 0 ]; then
            RATE=$(echo "scale=4; $ERROR_RATE / $TOTAL_REQUESTS * 100" | bc)
          else
            RATE="0"
          fi

          echo "error_rate=$RATE" >> "$GITHUB_OUTPUT"
          echo "5xx errors: $ERROR_RATE / $TOTAL_REQUESTS total requests"
          echo "Error rate: ${RATE}% (over ${LOOKBACK_MINUTES}-minute window)"

          # Auto-rollback if error rate exceeds 1%
          THRESHOLD="1.0"
          if (( $(echo "$RATE > $THRESHOLD" | bc -l) )); then
            echo "::error::[ERROR RATE] 5xx error rate ${RATE}% exceeds threshold ${THRESHOLD}% over ${LOOKBACK_MINUTES}-minute window. This indicates server errors in the new deployment."
            exit 1
          fi

          echo "Error rate check passed (${RATE}% < ${THRESHOLD}%)"

      - name: Summarize health check results
        if: success()
        run: |
          echo "=========================================="
          echo " PRODUCTION HEALTH CHECK SUMMARY"
          echo "=========================================="
          echo " Smoke test:          PASSED"
          echo " API health:          PASSED (HTTP ${{ steps.api-health.outputs.http_status }})"
          echo " Database:            PASSED (${{ steps.db-health.outputs.db_status }})"
          echo " Redis:               PASSED (${{ steps.redis-health.outputs.redis_status }})"
          echo " Error rate (7 min):  ${{ steps.error-rate.outputs.error_rate }}%"
          echo "=========================================="
          echo " All infrastructure dependency checks passed."
          echo "=========================================="

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "::error::One or more health checks failed. Initiating automatic rollback..."
          echo ""
          echo "=========================================="
          echo " FAILED HEALTH CHECK DIAGNOSIS"
          echo "=========================================="
          echo " Check the step outputs above to identify which dependency failed:"
          echo "  - [SMOKE TEST] = API not reachable at all"
          echo "  - [API HEALTH] = API responding but unhealthy"
          echo "  - [DATABASE]   = Database connectivity issue"
          echo "  - [REDIS]      = Redis/cache connectivity issue"
          echo "  - [ERROR RATE] = Excessive 5xx errors in production traffic"
          echo "=========================================="
          echo ""
          echo "Rolling back to previous task definitions..."

          # Rollback API
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service selfpublisherforge-api-production \
            --task-definition "${{ needs.deploy.outputs.previous-api-task-def }}" \
            --force-new-deployment

          # Rollback Frontend
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service selfpublisherforge-frontend-production \
            --task-definition "${{ needs.deploy.outputs.previous-frontend-task-def }}" \
            --force-new-deployment

          # Rollback Worker and Beat
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service selfpublisherforge-worker-production \
            --force-new-deployment
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service selfpublisherforge-beat-production \
            --force-new-deployment

          # Wait for rollback stability
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services selfpublisherforge-api-production selfpublisherforge-frontend-production

          echo "Rollback complete."

  # ---------------------------------------------------------------------------
  # Notify Slack
  # ---------------------------------------------------------------------------
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.health-check.result }}" == "success" ]; then
            echo "color=good" >> "$GITHUB_OUTPUT"
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "emoji=:rocket:" >> "$GITHUB_OUTPUT"
          else
            echo "color=danger" >> "$GITHUB_OUTPUT"
            echo "status=FAILED (ROLLBACK TRIGGERED)" >> "$GITHUB_OUTPUT"
            echo "emoji=:rotating_light:" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ steps.status.outputs.emoji }} *Production Deploy ${{ steps.status.outputs.status }}*\n*Version:* `${{ github.ref_name }}`\n*Repo:* ${{ github.repository }}\n*Actor:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
