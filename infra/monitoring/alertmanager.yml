# =============================================================================
# Alertmanager Configuration -- SelfPublisherForge
# =============================================================================
#
# REQUIRED ENVIRONMENT VARIABLES
# ---------------------------------------------------------------------------
# Each variable below must be set on the alertmanager container (or via an
# .env file).  When a variable is missing or empty, the corresponding
# notification channel will fail silently and alerts fall through to the
# "fallback-log" receiver, which writes to stdout so nothing is lost.
#
#   SMTP_SMARTHOST           SMTP relay host and port.
#                            Default when unset: localhost:587 (local relay).
#                            Production example: smtp.example.com:587
#
#   SMTP_FROM                Envelope-from / sender address.
#                            Example: alerts@selfpublisherforge.com
#
#   SMTP_AUTH_USERNAME        SMTP authentication login.
#                            Leave empty if the local relay needs no auth.
#
#   SMTP_AUTH_PASSWORD        SMTP authentication password / app-password.
#                            Treat as a secret -- prefer a Docker/K8s secret.
#
#   ALERT_EMAIL_TO           Recipient address for alert emails.
#                            Example: oncall@selfpublisherforge.com
#
#   SLACK_WEBHOOK_URL        Slack incoming-webhook URL for the #alerts channel.
#                            Create one at https://api.slack.com/messaging/webhooks
#                            Must start with https://hooks.slack.com/
#                            If unset, Slack notifications for P1-P3 are skipped.
#
#   SLACK_WEBHOOK_URL_CRITICAL
#                            Slack incoming-webhook URL for the #incidents channel.
#                            Must start with https://hooks.slack.com/
#                            If unset, critical Slack notifications are skipped.
#
# =============================================================================

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
# smtp_smarthost falls back to a local relay (localhost:587) when the env var
# is empty.  This lets the stack start without external SMTP during local dev;
# emails will simply fail to deliver until a real relay is configured.
global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_SMARTHOST:-localhost:587}"
  smtp_from: "${SMTP_FROM:-alertmanager@localhost}"
  smtp_auth_username: "${SMTP_AUTH_USERNAME}"
  smtp_auth_password: "${SMTP_AUTH_PASSWORD}"
  # require_tls: true -- enforces STARTTLS for every SMTP connection.
  # Disable only for local dev relays that do not support TLS.
  smtp_require_tls: true

# ---------------------------------------------------------------------------
# Notification templates
# ---------------------------------------------------------------------------
# If external .tmpl files exist under /etc/alertmanager/templates/ they will
# be loaded.  When no files match the glob, Alertmanager uses Go's default
# template functions plus the inline definitions below.
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# Inline template definitions -- used as fallback when no .tmpl files exist.
# These are embedded directly in the receivers via Go template syntax, so
# Alertmanager will always have usable formatting even on a fresh deploy
# without mounting a templates volume.
#
# Template reference (used in receiver configs below):
#   {{ template "slack.title" . }}
#   {{ template "slack.text" . }}
#   {{ template "email.subject" . }}

# ---------------------------------------------------------------------------
# Routing tree
# ---------------------------------------------------------------------------
# The top-level receiver is "fallback-log" which writes to stdout.  This
# guarantees that even when SMTP and Slack are both unconfigured, alerts are
# visible in container logs.  Severity-specific sub-routes override this with
# richer notification channels.
route:
  receiver: fallback-log
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # --- Maintenance window silencer -------------------------------------------
    # Alerts tagged maintenance: "true" are silently dropped via the null
    # receiver.  Apply this label in recording rules or with amtool during
    # planned maintenance.
    - receiver: "null"
      matchers:
        - maintenance = "true"
      continue: false

    # P0 Critical -- page immediately via email + Slack #incidents
    - receiver: critical-pager
      matchers:
        - severity = "P0"
      group_wait: 10s
      repeat_interval: 15m
      continue: false

    # P1 Urgent -- Slack #alerts + email
    - receiver: urgent-slack
      matchers:
        - severity = "P1"
      group_wait: 30s
      repeat_interval: 1h
      continue: false

    # P2 Warning -- Slack #alerts only
    - receiver: default-slack
      matchers:
        - severity = "P2"
      repeat_interval: 4h
      continue: false

    # P3 Informational -- Slack #monitoring, low-noise
    - receiver: informational-slack
      matchers:
        - severity = "P3"
      repeat_interval: 12h
      continue: false

# ---------------------------------------------------------------------------
# Inhibition rules
# ---------------------------------------------------------------------------
# When a higher-severity alert fires for a given service, lower-severity
# alerts for the same service are suppressed to reduce noise.
#
# Hierarchy: P0 suppresses P1/P2/P3, P1 suppresses P2/P3, P2 suppresses P3.
inhibit_rules:
  # P0 firing -> suppress P1, P2, P3 for the same service
  - source_matchers:
      - severity = "P0"
    target_matchers:
      - severity =~ "P1|P2|P3"
    equal: ["service"]

  # P1 firing -> suppress P2, P3 for the same service
  - source_matchers:
      - severity = "P1"
    target_matchers:
      - severity =~ "P2|P3"
    equal: ["service"]

  # P2 firing -> suppress P3 for the same service
  - source_matchers:
      - severity = "P2"
    target_matchers:
      - severity = "P3"
    equal: ["service"]

# ---------------------------------------------------------------------------
# Receivers
# ---------------------------------------------------------------------------
receivers:
  # --- Fallback: stdout log ------------------------------------------------
  # This receiver is the default top-level route target.  Alertmanager's
  # webhook_configs with a deliberately unreachable URL will cause the alert
  # to appear in alertmanager's own logs (stdout).  This ensures alerts are
  # never silently lost when SMTP and Slack are not configured.
  - name: fallback-log
    webhook_configs:
      - url: "http://localhost:9087/dev/null"
        send_resolved: true
        # This webhook is intentionally a no-op sink.  If you run a local
        # log-receiver (e.g. alertmanager-webhook-logger), point it here.
        # Otherwise alerts simply appear in alertmanager container logs when
        # the POST fails, which is the desired fallback behavior.

  # --- Null receiver: silent drop ------------------------------------------
  # Used for maintenance windows or alerts that should be intentionally
  # ignored.  No notification channels are configured.
  - name: "null"

  # --- P0 Critical ---------------------------------------------------------
  - name: critical-pager
    email_configs:
      - to: "${ALERT_EMAIL_TO:-oncall@localhost}"
        send_resolved: true
        headers:
          Subject: "[P0 CRITICAL] {{ .GroupLabels.alertname }} - SelfPublisherForge"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL_CRITICAL}"
        channel: "#incidents"
        title: 'P0 CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # --- P1 Urgent -----------------------------------------------------------
  - name: urgent-slack
    email_configs:
      - to: "${ALERT_EMAIL_TO:-oncall@localhost}"
        send_resolved: true
        headers:
          Subject: "[P1 URGENT] {{ .GroupLabels.alertname }} - SelfPublisherForge"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: 'P1 URGENT: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # --- P2 Warning ----------------------------------------------------------
  - name: default-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: 'P2 WARNING: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # --- P3 Informational ----------------------------------------------------
  - name: informational-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#monitoring"
        title: 'P3 INFO: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: false
        color: '{{ if eq .Status "firing" }}#439FE0{{ else }}good{{ end }}'
