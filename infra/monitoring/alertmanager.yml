# =============================================================================
# Alertmanager Configuration -- SelfPublisherForge
# =============================================================================
#
# REQUIRED ENVIRONMENT VARIABLES
# ---------------------------------------------------------------------------
# Each variable below MUST be set on the alertmanager container (or via an
# .env file) before deploying to production.  Local dev can omit them, but
# email and Slack alerts will not function without them.
#
#   SMTP_SMARTHOST           SMTP relay host and port.
#                            Example: smtp.mailgun.org:587
#                            ** REQUIRED for production. **
#                            If unset: falls back to "localhost:587" which will
#                            fail on any host without a local MTA.  All email
#                            alerts (P0 critical-pager, P1 urgent) silently
#                            fail and fall through to Slack / fallback-log.
#
#   SMTP_FROM                Envelope-from / sender address.
#                            Example: alerts@selfpublisherforge.com
#                            ** REQUIRED for production. **
#                            If unset: defaults to "alertmanager@localhost"
#                            which will be rejected by virtually every SMTP
#                            relay and spam filter.
#
#   SMTP_AUTH_USERNAME        SMTP authentication login.
#                            Example: postmaster@mg.selfpublisherforge.com
#                            ** REQUIRED for production (unless relay is
#                            IP-whitelisted). **
#                            If unset: SMTP AUTH is skipped; most cloud relays
#                            (Mailgun, SES, SendGrid) will reject the
#                            connection with 535 Authentication Failed.
#
#   SMTP_AUTH_PASSWORD        SMTP authentication password / app-password.
#                            ** REQUIRED for production. Treat as a secret --
#                            prefer a Docker secret or K8s sealed-secret. **
#                            If unset: same as SMTP_AUTH_USERNAME -- relay
#                            rejects the connection; email alerts never send.
#
#   ALERT_EMAIL_TO           Recipient address for alert emails.
#                            Example: oncall@selfpublisherforge.com
#                            ** REQUIRED for production. **
#                            If unset: defaults to "oncall@localhost" which is
#                            undeliverable; email alerts are silently lost.
#
#   SLACK_WEBHOOK_URL        Slack incoming-webhook URL for the #alerts channel.
#                            Create one at https://api.slack.com/messaging/webhooks
#                            Must start with https://hooks.slack.com/
#                            ** REQUIRED for production (P1-P3 alerts). **
#                            If unset: Slack notifications for P1/P2/P3 are
#                            skipped entirely; those alerts only appear in
#                            the fallback-log receiver (container logs).
#
#   SLACK_WEBHOOK_URL_CRITICAL
#                            Slack incoming-webhook URL for the #incidents
#                            channel (separate from #alerts for P0 noise
#                            isolation).
#                            Must start with https://hooks.slack.com/
#                            ** REQUIRED for production (P0 alerts). **
#                            If unset: P0 Slack notifications to #incidents
#                            are skipped; P0 still fires email + fallback-log.
#
# =============================================================================
#
# PRODUCTION CHECKLIST
# ---------------------------------------------------------------------------
# Before going live, verify each variable is set.  Here is what breaks when
# each one is missing:
#
#   Variable missing              | Impact
#   ------------------------------|------------------------------------------
#   SMTP_SMARTHOST                | ALL email alerts fail (P0 + P1).
#                                 | Alertmanager logs "connection refused" or
#                                 | "dial tcp localhost:587: connect: ..."
#   SMTP_FROM                     | Emails rejected by relay or marked spam.
#   SMTP_AUTH_USERNAME            | 535 auth error from relay; emails fail.
#   SMTP_AUTH_PASSWORD            | Same as above; emails fail.
#   ALERT_EMAIL_TO               | Emails sent to "oncall@localhost" -- lost.
#   SLACK_WEBHOOK_URL            | P1/P2/P3 Slack alerts silently skipped.
#   SLACK_WEBHOOK_URL_CRITICAL   | P0 Slack alerts to #incidents skipped.
#
# Verification command (run inside the alertmanager container):
#   amtool check-config /etc/alertmanager/alertmanager.yml
#
# Smoke-test an alert:
#   amtool alert add test_alert severity=P0 service=healthcheck \
#     --annotation=description="Production smoke test"
#
# =============================================================================

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
# smtp_smarthost falls back to a local relay (localhost:587) when the env var
# is empty.  This lets the stack start without external SMTP during local dev;
# emails will simply fail to deliver until a real relay is configured.
#
# WARNING: In production, SMTP_SMARTHOST *must* be set to a real relay.
# The localhost:587 fallback will cause silent email delivery failures.
global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_SMARTHOST:-localhost:587}"
  smtp_from: "${SMTP_FROM:-alertmanager@localhost}"
  smtp_auth_username: "${SMTP_AUTH_USERNAME}"
  smtp_auth_password: "${SMTP_AUTH_PASSWORD}"
  # require_tls: true -- enforces STARTTLS for every SMTP connection.
  # Disable only for local dev relays that do not support TLS.
  smtp_require_tls: true

# ---------------------------------------------------------------------------
# Notification templates
# ---------------------------------------------------------------------------
# If external .tmpl files exist under /etc/alertmanager/templates/ they will
# be loaded.  When no files match the glob, Alertmanager uses Go's default
# template functions plus the inline definitions below.
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# Inline template definitions -- used as fallback when no .tmpl files exist.
# These are embedded directly in the receivers via Go template syntax, so
# Alertmanager will always have usable formatting even on a fresh deploy
# without mounting a templates volume.
#
# Template reference (used in receiver configs below):
#   {{ template "slack.title" . }}
#   {{ template "slack.text" . }}
#   {{ template "email.subject" . }}

# ---------------------------------------------------------------------------
# Routing tree
# ---------------------------------------------------------------------------
# The top-level receiver is "fallback-log" -- a file-based logger that writes
# alert JSON to /var/log/alertmanager/fallback-alerts.log.  This guarantees
# that even when SMTP and Slack are both unconfigured, alerts are persisted
# to a durable file (not just ephemeral container stdout).
#
# Severity-specific sub-routes override this with richer notification
# channels.  Each severity route has continue: true so that if the primary
# receiver fails, alerts still reach the fallback-log via the top-level
# default.
route:
  receiver: fallback-log
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # --- Maintenance window silencer -----------------------------------------
    # Alerts tagged maintenance: "true" are silently dropped via the null
    # receiver.  Apply this label in recording rules or with amtool during
    # planned maintenance.
    #
    # To activate a maintenance window:
    #   amtool silence add maintenance="true" \
    #     --comment="Scheduled DB maintenance" --duration=2h
    #
    # Or add the label in your alerting rules:
    #   labels:
    #     maintenance: "true"
    - receiver: "null"
      matchers:
        - maintenance = "true"
      continue: false

    # P0 Critical -- page immediately via email + Slack #incidents
    # repeat_interval: 15m -- critical alerts re-fire every 15 minutes
    # until acknowledged or resolved, ensuring they are never missed.
    - receiver: critical-pager
      matchers:
        - severity = "P0"
      group_wait: 10s
      repeat_interval: 15m
      continue: false

    # P1 Urgent -- Slack #alerts + email
    - receiver: urgent-slack
      matchers:
        - severity = "P1"
      group_wait: 30s
      repeat_interval: 1h
      continue: false

    # P2 Warning -- Slack #alerts only
    - receiver: default-slack
      matchers:
        - severity = "P2"
      repeat_interval: 4h
      continue: false

    # P3 Informational -- Slack #monitoring, low-noise
    - receiver: informational-slack
      matchers:
        - severity = "P3"
      repeat_interval: 12h
      continue: false

# ---------------------------------------------------------------------------
# Inhibition rules
# ---------------------------------------------------------------------------
# When a higher-severity alert fires for a given service, lower-severity
# alerts for the same service are suppressed to reduce noise.
#
# Hierarchy: P0 suppresses P1/P2/P3, P1 suppresses P2/P3, P2 suppresses P3.
inhibit_rules:
  # P0 firing -> suppress P1, P2, P3 for the same service
  - source_matchers:
      - severity = "P0"
    target_matchers:
      - severity =~ "P1|P2|P3"
    equal: ["service"]

  # P1 firing -> suppress P2, P3 for the same service
  - source_matchers:
      - severity = "P1"
    target_matchers:
      - severity =~ "P2|P3"
    equal: ["service"]

  # P2 firing -> suppress P3 for the same service
  - source_matchers:
      - severity = "P2"
    target_matchers:
      - severity = "P3"
    equal: ["service"]

# ---------------------------------------------------------------------------
# Receivers
# ---------------------------------------------------------------------------
receivers:
  # --- Fallback: file-based log ---------------------------------------------
  # This receiver is the default top-level route target.  It writes alert
  # payloads as JSON to a persistent log file using Alertmanager's built-in
  # webhook_configs pointed at a local file-logging sidecar.
  #
  # Fallback chain (most robust to least):
  #   1. Try Slack #alerts (works if SLACK_WEBHOOK_URL is set)
  #   2. Always write to file via webhook-to-file logger
  #
  # This ensures alerts are NEVER silently lost.  Even if SMTP is down and
  # Slack is unconfigured, the file log captures every alert payload.
  #
  # The webhook-to-file logger listens on port 9095 inside the monitoring
  # network.  Deploy it alongside alertmanager (see docker-compose.monitoring.yml).
  # If the logger sidecar is also down, Alertmanager logs the POST failure
  # to its own stdout as a final safety net.
  - name: fallback-log
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: 'FALLBACK: {{ .GroupLabels.alertname }} [{{ .CommonLabels.severity }}]'
        text: >-
          *Receiver:* fallback-log (primary receivers may be misconfigured)
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    webhook_configs:
      - url: "http://alertmanager-logger:9095/alerts"
        send_resolved: true
        # alertmanager-logger writes each POST body as a JSON line to
        # /var/log/alertmanager/fallback-alerts.log.  Mount this path
        # as a persistent volume so alerts survive container restarts.

  # --- Null receiver: silent drop ------------------------------------------
  # Used exclusively for maintenance windows.  No notification channels are
  # configured -- alerts routed here are intentionally and completely
  # silenced.
  #
  # CAUTION: Only route alerts here via the maintenance="true" matcher.
  # Routing production alerts to "null" will cause them to vanish with
  # zero notification to any channel.  Use amtool to verify active
  # silences:  amtool silence query
  - name: "null"

  # --- P0 Critical ---------------------------------------------------------
  # Notifies via:  email (on-call) + Slack #incidents + fallback file log
  # repeat_interval is set on the route (15m) so P0 re-fires until resolved.
  - name: critical-pager
    email_configs:
      - to: "${ALERT_EMAIL_TO:-oncall@localhost}"
        from: "${SMTP_FROM:-alertmanager@localhost}"
        # send_resolved: true -- sends a follow-up "RESOLVED" email when the
        # alert clears, so the on-call engineer knows the incident is over
        # without needing to check dashboards.
        send_resolved: true
        headers:
          Subject: "[P0 CRITICAL] {{ .GroupLabels.alertname }} - SelfPublisherForge"
          Priority: "urgent"
          X-Alert-Severity: "P0"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL_CRITICAL}"
        channel: "#incidents"
        title: 'P0 CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    # P0 also writes to the file logger as a durable audit trail
    webhook_configs:
      - url: "http://alertmanager-logger:9095/alerts"
        send_resolved: true

  # --- P1 Urgent -----------------------------------------------------------
  # Notifies via:  email (on-call) + Slack #alerts
  - name: urgent-slack
    email_configs:
      - to: "${ALERT_EMAIL_TO:-oncall@localhost}"
        from: "${SMTP_FROM:-alertmanager@localhost}"
        # send_resolved: true -- notifies when the urgent condition clears.
        send_resolved: true
        headers:
          Subject: "[P1 URGENT] {{ .GroupLabels.alertname }} - SelfPublisherForge"
          X-Alert-Severity: "P1"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: 'P1 URGENT: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # --- P2 Warning ----------------------------------------------------------
  # Notifies via:  Slack #alerts only (no email to reduce noise)
  - name: default-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: 'P2 WARNING: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # --- P3 Informational ----------------------------------------------------
  # Notifies via:  Slack #monitoring only (low-noise channel)
  - name: informational-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#monitoring"
        title: 'P3 INFO: {{ .GroupLabels.alertname }}'
        text: >-
          *Service:* {{ .CommonLabels.service }}
          *Details:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: false
        color: '{{ if eq .Status "firing" }}#439FE0{{ else }}good{{ end }}'
