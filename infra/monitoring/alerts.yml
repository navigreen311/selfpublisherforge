# =============================================================================
# Prometheus AlertManager Rules
# Severity tiers: P0 (critical) through P3 (informational)
# =============================================================================
# P0: Immediate response required (page on-call)
# P1: Urgent response within 15 minutes
# P2: Respond within 1 hour
# P3: Informational / next business day

groups:
  # ---------------------------------------------------------------------------
  # Meta — Infrastructure alerts for monitoring health
  # ---------------------------------------------------------------------------
  - name: selfpublisherforge-meta
    rules:
      - alert: TargetDown
        # Fires when any Prometheus scrape target is unreachable.
        # The `up` metric is automatically generated for every scrape target:
        # 1 = healthy, 0 = scrape failed.
        expr: up == 0
        for: 5m
        labels:
          severity: P0
          service: monitoring
          env: production
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
          description: "P0 CRITICAL: Prometheus cannot reach scrape target {{ $labels.job }}/{{ $labels.instance }}. The target has been unreachable for over 5 minutes. Metrics from this target are stale."
          runbook_url: "docs/runbooks/target-down.md"

      - alert: Watchdog
        # This is a dead-man's-switch alert. It fires continuously to verify
        # the entire alerting pipeline (Prometheus -> AlertManager -> receiver)
        # is functional. If this alert ever stops firing, it means the
        # alerting pipeline itself is broken.
        expr: vector(1)
        for: 0m
        labels:
          severity: none
          service: monitoring
          env: production
        annotations:
          summary: "Watchdog: alerting pipeline is healthy"
          description: "This is a dead-man's-switch alert. It fires continuously to confirm the Prometheus -> AlertManager -> notification pipeline is operational. If you stop receiving this alert, the alerting system itself is broken."
          runbook_url: "docs/runbooks/watchdog.md"

  # ---------------------------------------------------------------------------
  # P0 — Critical: Immediate paging, service is down or data loss risk
  # ---------------------------------------------------------------------------
  - name: selfpublisherforge-p0-critical
    rules:
      - alert: APIServiceDown
        # Uses the built-in `up` metric for the spf-api scrape target.
        # up == 0 means Prometheus failed to scrape the /metrics endpoint,
        # indicating the API service is unreachable.
        # Note: The previous aws_ecs_service_running_task_count metric required
        # a YACE/CloudWatch exporter which is not configured as a scrape target.
        expr: up{job="spf-api"} == 0
        for: 5m
        labels:
          severity: P0
          service: api
          env: production
        annotations:
          summary: "API service has zero running tasks in production"
          description: "P0 CRITICAL: API service has zero running tasks in production. Service is completely unavailable to users."
          runbook_url: "docs/runbooks/api-service-down.md"

      - alert: DatabaseConnectionFailure
        # pg_up is the standard postgres_exporter liveness metric (1 = up, 0 = down)
        expr: pg_up{instance=~"selfpublisherforge-production-postgres.*"} == 0
        for: 2m
        labels:
          severity: P0
          service: database
          env: production
        annotations:
          summary: "PostgreSQL database is unreachable"
          description: "P0 CRITICAL: PostgreSQL exporter reports database is down. RDS instance may be unreachable."
          runbook_url: "docs/runbooks/rds-connection-failure.md"

      - alert: APIErrorRateCritical
        expr: >
          (
            sum(rate(http_requests_total{job="spf-api", status=~"5.."}[5m]))
          /
            sum(rate(http_requests_total{job="spf-api"}[5m]))
          ) * 100 > 5
        for: 5m
        labels:
          severity: P0
          service: api
          env: production
        annotations:
          summary: "API error rate has exceeded 5%"
          description: "P0 CRITICAL: API error rate has exceeded 5%. Current value: {{ $value | printf \"%.2f\" }}%. Widespread failures affecting users."
          runbook_url: "docs/runbooks/high-error-rate.md"

      - alert: RDSStorageSpaceCritical
        expr: aws_rds_free_storage_space_average{dbinstance_identifier="selfpublisherforge-production-postgres"} < 2147483648
        for: 5m
        labels:
          severity: P0
          service: database
          env: production
        annotations:
          summary: "RDS free storage is below 2 GB"
          description: "P0 CRITICAL: RDS free storage is below 2 GB. Database writes may fail imminently."
          runbook_url: "docs/runbooks/rds-storage-critical.md"

  # ---------------------------------------------------------------------------
  # P1 — Urgent: Respond within 15 minutes, degraded experience
  # ---------------------------------------------------------------------------
  - name: selfpublisherforge-p1-urgent
    rules:
      - alert: APILatencyP95Critical
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="spf-api"}[10m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: P1
          service: api
          env: production
        annotations:
          summary: "API P95 latency has exceeded 2 seconds"
          description: "P1 URGENT: API P95 latency has exceeded 2 seconds. Current P95: {{ $value | printf \"%.3f\" }}s. Users are experiencing significant slowness."
          runbook_url: "docs/runbooks/high-latency.md"

      - alert: APIErrorRateWarning
        expr: >
          (
            sum(rate(http_requests_total{job="spf-api", status=~"5.."}[10m]))
          /
            sum(rate(http_requests_total{job="spf-api"}[10m]))
          ) * 100 > 1
        for: 10m
        labels:
          severity: P1
          service: api
          env: production
        annotations:
          summary: "API error rate has exceeded 1% SLO threshold"
          description: "P1 URGENT: API error rate has exceeded 1% SLO threshold. Current rate: {{ $value | printf \"%.2f\" }}%."
          runbook_url: "docs/runbooks/elevated-error-rate.md"

      - alert: CeleryQueueDepthCritical
        # celery_queue_length is exported by celery-exporter (danihodovic/celery-exporter).
        # Scraped via job "spf-celery-exporter" on celery-exporter:9808.
        # If this alert never fires, verify celery-exporter is deployed and reachable.
        expr: celery_queue_length{queue="celery", env="production"} > 500
        for: 10m
        labels:
          severity: P1
          service: worker
          env: production
        annotations:
          summary: "Celery queue depth has exceeded 500 tasks"
          description: "P1 URGENT: Celery queue depth has exceeded 500 tasks. Current depth: {{ $value }}. Background job processing is severely backed up."
          runbook_url: "docs/runbooks/celery-queue-backup.md"

      - alert: RDSCPUCritical
        expr: aws_rds_cpuutilization_average{dbinstance_identifier="selfpublisherforge-production-postgres"} > 90
        for: 10m
        labels:
          severity: P1
          service: database
          env: production
        annotations:
          summary: "RDS CPU utilization is above 90%"
          description: "P1 URGENT: RDS CPU utilization is above 90%. Current: {{ $value | printf \"%.1f\" }}%. Database performance is likely degraded."
          runbook_url: "docs/runbooks/rds-high-cpu.md"

      - alert: RedisMemoryUsageCritical
        expr: >
          (redis_used_memory_bytes{instance=~"selfpublisherforge-production-redis.*"}
          /
          redis_config_maxmemory{instance=~"selfpublisherforge-production-redis.*"})
          * 100 > 90
        for: 10m
        labels:
          severity: P1
          service: redis
          env: production
        annotations:
          summary: "Redis memory usage is above 90%"
          description: "P1 URGENT: Redis memory usage is above 90%. Current: {{ $value | printf \"%.1f\" }}%. Cache evictions may be occurring, LRU eviction will accelerate."
          runbook_url: "docs/runbooks/redis-high-memory.md"

      - alert: ElasticsearchClusterHealthRed
        # elasticsearch_cluster_health_status is from elasticsearch_exporter
        expr: elasticsearch_cluster_health_status{color="red", cluster=~"selfpublisherforge.*"} == 1
        for: 5m
        labels:
          severity: P1
          service: elasticsearch
          env: production
        annotations:
          summary: "Elasticsearch cluster health is RED"
          description: "P1 URGENT: Elasticsearch cluster health is RED. One or more primary shards are unassigned. Search functionality may be degraded or unavailable."
          runbook_url: "docs/runbooks/elasticsearch-red.md"

  # ---------------------------------------------------------------------------
  # P2 — Warning: Respond within 1 hour, potential issue developing
  # ---------------------------------------------------------------------------
  - name: selfpublisherforge-p2-warning
    rules:
      - alert: APIServiceFlapping
        # Detects service instability by counting how many times the API scrape
        # target transitioned between up/down states in a 30-minute window.
        # This replaces the previous aws_ecs_container_restarts_sum metric which
        # is not a standard ECS/CloudWatch metric and had no corresponding
        # scrape target configured in prometheus.yml.
        expr: changes(up{job="spf-api"}[30m]) > 5
        for: 10m
        labels:
          severity: P2
          service: api
          env: production
        annotations:
          summary: "API service is flapping — excessive restarts detected"
          description: "P2 WARNING: API service has changed state (up/down) more than 5 times in 30 minutes. Possible crash loop, OOM kills, or deployment instability."
          runbook_url: "docs/runbooks/ecs-task-restarts.md"

      - alert: APILatencyP95Warning
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="spf-api"}[15m])) by (le)
          ) > 0.5
        for: 15m
        labels:
          severity: P2
          service: api
          env: production
        annotations:
          summary: "API P95 latency exceeds 500ms SLO target"
          description: "P2 WARNING: API P95 latency exceeds 500ms SLO target. Current P95: {{ $value | printf \"%.3f\" }}s."
          runbook_url: "docs/runbooks/latency-investigation.md"

      - alert: CeleryTaskFailureRate
        # celery_task_failed_total and celery_task_succeeded_total are standard
        # metrics from celery-exporter (danihodovic/celery-exporter).
        # Scraped via job "spf-celery-exporter" on celery-exporter:9808.
        expr: >
          (
            sum(rate(celery_task_failed_total{env="production"}[15m]))
          /
            (
              sum(rate(celery_task_succeeded_total{env="production"}[15m]))
            +
              sum(rate(celery_task_failed_total{env="production"}[15m]))
            )
          ) * 100 > 5
        for: 15m
        labels:
          severity: P2
          service: worker
          env: production
        annotations:
          summary: "Celery task failure rate exceeds 5%"
          description: "P2 WARNING: Celery task failure rate exceeds 5%. Current rate: {{ $value | printf \"%.2f\" }}%."
          runbook_url: "docs/runbooks/celery-failures.md"

      - alert: RDSFreeStorageLow
        expr: aws_rds_free_storage_space_average{dbinstance_identifier="selfpublisherforge-production-postgres"} < 10737418240
        for: 15m
        labels:
          severity: P2
          service: database
          env: production
        annotations:
          summary: "RDS free storage is below 10 GB"
          description: "P2 WARNING: RDS free storage is below 10 GB. Current free: {{ $value | humanize1024 }}B. Plan for storage expansion."
          runbook_url: "docs/runbooks/rds-storage-low.md"

      - alert: DBConnectionPoolNearCapacity
        expr: pg_stat_activity_count{instance=~"selfpublisherforge-production-postgres.*"} > 150
        for: 10m
        labels:
          severity: P2
          service: database
          env: production
        annotations:
          summary: "Database connection count is above 150 (max 200)"
          description: "P2 WARNING: Database connection count is above 150 (max 200). Current connections: {{ $value }}."
          runbook_url: "docs/runbooks/db-connection-pool.md"

      - alert: ElasticsearchClusterHealthYellow
        # elasticsearch_cluster_health_status is from elasticsearch_exporter
        expr: elasticsearch_cluster_health_status{color="yellow", cluster=~"selfpublisherforge.*"} == 1
        for: 30m
        labels:
          severity: P2
          service: elasticsearch
          env: production
        annotations:
          summary: "Elasticsearch cluster health is YELLOW"
          description: "P2 WARNING: Elasticsearch cluster health is YELLOW for over 30 minutes. One or more replica shards are unassigned. Redundancy is reduced."
          runbook_url: "docs/runbooks/elasticsearch-yellow.md"

  # ---------------------------------------------------------------------------
  # P3 — Informational: Next business day, tracking trends
  # ---------------------------------------------------------------------------
  - name: selfpublisherforge-p3-informational
    rules:
      - alert: HighCPUUsageSustained
        # container_cpu_usage_seconds_total is a standard cAdvisor/ECS Container Insights metric
        expr: >
          avg(rate(container_cpu_usage_seconds_total{container_label_com_amazonaws_ecs_cluster="selfpublisherforge-production"}[5m])) by (container_label_com_amazonaws_ecs_task_definition_family) > 0.7
        for: 1h
        labels:
          severity: P3
          service: ecs
          env: production
        annotations:
          summary: "ECS task family {{ $labels.container_label_com_amazonaws_ecs_task_definition_family }} CPU sustained above 70%"
          description: "P3 INFO: ECS task family {{ $labels.container_label_com_amazonaws_ecs_task_definition_family }} CPU has been above 70% for 1 hour. Consider scaling review."
          runbook_url: "docs/runbooks/high-cpu.md"

      - alert: RedisCacheHitRateLow
        expr: >
          (
            rate(redis_keyspace_hits_total{instance=~"selfpublisherforge-production-redis.*"}[1h])
          /
            (
              rate(redis_keyspace_hits_total{instance=~"selfpublisherforge-production-redis.*"}[1h])
            +
              rate(redis_keyspace_misses_total{instance=~"selfpublisherforge-production-redis.*"}[1h])
            )
          ) * 100 < 80
        for: 1h
        labels:
          severity: P3
          service: redis
          env: production
        annotations:
          summary: "Redis cache hit rate is below 80%"
          description: "P3 INFO: Redis cache hit rate is below 80%. Current rate: {{ $value | printf \"%.1f\" }}%. Review cache key strategies and TTLs."
          runbook_url: "docs/runbooks/redis-low-hit-rate.md"

      - alert: CeleryQueueGrowingTrend
        # celery_queue_length is exported by celery-exporter (danihodovic/celery-exporter).
        # Scraped via job "spf-celery-exporter" on celery-exporter:9808.
        # If this alert never fires, verify celery-exporter is deployed and reachable.
        expr: celery_queue_length{queue="celery", env="production"} > 100
        for: 1h
        labels:
          severity: P3
          service: worker
          env: production
        annotations:
          summary: "Celery queue depth sustained above 100"
          description: "P3 INFO: Celery queue depth has been above 100 for 1 hour. Current depth: {{ $value }}. May need more workers or task optimization."
          runbook_url: "docs/runbooks/celery-queue-growing.md"

      - alert: DeploymentCompleted
        expr: >
          time() - deploy_last_timestamp{env="production", app="selfpublisherforge"} < 300
        for: 0m
        labels:
          severity: P3
          service: deploy
          env: production
        annotations:
          summary: "A new deployment to production has been detected"
          description: "P3 INFO: A new deployment to production has been detected. Review deployment health metrics."
          runbook_url: "docs/runbooks/deployment-completed.md"
